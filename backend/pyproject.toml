[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backplane-api"
version = "0.1.0"
description = "API and automation operations control plane"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2,<2",
  "apscheduler>=3.10.4,<4",
  "arq>=0.26.1,<1",
  "asyncpg>=0.29.0,<1",
  "cryptography>=43.0.0,<45",
  "croniter>=3.0.3,<4",
  "email-validator>=2.2.0,<3",
  "fastapi>=0.115.0,<1",
  "httpx>=0.27.2,<1",
  "orjson>=3.10.7,<4",
  "prometheus-client>=0.21.0,<1",
  "pydantic-settings>=2.5.2,<3",
  "pyjwt>=2.9.0,<3",
  "python-multipart>=0.0.12,<1",
  "redis>=5.1.1,<6",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "structlog>=24.4.0,<25",
  "uvicorn[standard]>=0.30.6,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0,<1",
  "mypy>=1.11.2,<2",
  "pytest>=8.3.3,<9",
  "pytest-asyncio>=0.24.0,<1",
  "pytest-cov>=5.0.0,<6",
  "ruff>=0.6.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
warn_unused_ignores = true
disallow_untyped_defs = true

